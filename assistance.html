<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistance</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link href="logo.jpeg" rel="shortcut icon" type="image/x-icon">
  <script type="importmap">
    {
      "imports": {
        "@google/generative-ai": "https://esm.run/@google/generative-ai"
      }
    }
  </script>
  <link href="https://jeeteshvasisth.github.io/Brace/style.css" rel="stylesheet" type="text/css" />
  <link href="https://jeeteshvasisth.github.io/Brace/assistance.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <header>
    <nav class="navbar">
      <a href="https://jeeteshvasisth.github.io/Brace/index.html" class="logo">
        <img style="width: 90px;" src="images/brace.png" />
      </a>
      <ul class="menu-links">
        <span id="close-menu-btn" class="material-symbols-outlined">close</span>
        <div class="dropdown">
          <button class="dropbtn">Emergency</button>
          <div class="dropdown-content">
            <a href="https://jeeteshvasisth.github.io/Brace/help.html">Help</a>
            <a href="https://jeeteshvasisth.github.io/Brace/broadcast.html">Broadcast</a>
          </div>
        </div>
        <div class="dropdown">
          <button class="dropbtn">Community</button>
          <div class="dropdown-content">
            <a href="https://jeeteshvasisth.github.io/Brace/volunteer.html">Volunteer</a>
          </div>
        </div>
        <div class="dropdown">
          <button class="dropbtn">Assistance</button>
          <div class="dropdown-content">
            <a href="https://jeeteshvasisth.github.io/Brace/assistance.html">AI</a>
            <a href="https://jeeteshvasisth.github.io/Brace/human.html">Human</a>
          </div>
        </div>
        <div class="dropdown">
          <button class="dropbtn">Management</button>
          <div class="dropdown-content">
            <a href="https://jeeteshvasisth.github.io/Brace/precautions.html">Precaution</a>
            <a href="https://jeeteshvasisth.github.io/Brace/post.html">Post disaster</a>
          </div>
        </div>
      </ul>
      <span id="menu-btn" class="material-symbols-outlined">menu</span>
    </nav>
  </header>
  <section class="main">
    <h1>I am your Disaster Management Expert</h1>
    <footer id="output"></footer>
    <div class="bottom-section">
      <div class="input-container">
        <input />
        <div id="submit">&#x27A2;</div>
      </div>
    </div>
  </section>
  <script type="module">
    import {GoogleGenerativeAI} from "@google/generative-ai";
    const keys = ["AIzaSyC34ozdKiz-8OOyge6RGHerVyk2qWdRX4U", "AIzaSyAcd06hFcMMqpJU1fQDWKS4jhwE6LUvN48", "AIzaSyD1XZBwlBBt9xwa3KhLQvXRSdyfdR_iY94", "AIzaSyA9HHeiJPbi_cMaCqe5Knwckq5xtfuXFAY"]
    const submitButton = document.getElementById("submit");
    const outputElement = document.getElementById("output");
    const inputElement = document.querySelector("input");
    const buttonElement = document.querySelector("button");
    var indice = 0
    async function run() {
      const API_KEY = keys[indice]
      const genAI = new GoogleGenerativeAI(API_KEY);
      const model = genAI.getGenerativeModel({model: "gemini-1.5-pro"});
      var dots = "."
      var interval = setInterval(() => {outputElement.innerHTML = dots; if (dots.length < 3) {dots += "."} else {dots = "."} }, 200)
      try {
        var question = "You are a disaster manager. You can always response to greetings nicely. If it is not related to disasters then say that you don't know the answer. Give the proper answer to the following question in 100 words: " + inputElement.value
        inputElement.value = ""
        const result = await model.generateContent(question);
        const response = await result.response;
        const text = response.text();
        clearInterval(interval)
        outputElement.innerHTML = text
        if (indice < 3) {
          indice += 1;
        } else {
          indice = 0
        }
      } catch (e) {
        inputElement.value = ""
        clearInterval(interval)
        console.log(e)
        outputElement.innerHTML = "I failed to load a response for you right now..."
        if (indice < 3) {
          indice += 1;
        } else {
          indice = 0
        }
      }
    }
    submitButton.addEventListener("click", run);
    const header = document.querySelector("header");
    const menuBtn = document.querySelector("#menu-btn");
    const closeMenuBtn = document.querySelector("#close-menu-btn");

    menuBtn.addEventListener("click", () => {
      header.classList.toggle("show-mobile-menu");
    })

    closeMenuBtn.addEventListener("click", () => {
      menuBtn.click()
    })
  </script>
</body>

</html>
